<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102b38">
  <meta name="description" content="Current Lake Lanier elevation and water level history near Buford Dam, Georgia.">
  <meta name="apple-mobile-web-app-title" content="Lake Lanier">
  <title>Lake Lanier Water Level</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/lanier-32.png">
  <link rel="apple-touch-icon" sizes="152x152" href="./icons/lanier-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="./icons/lanier-167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/lanier-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="lake-title">
      <div class="shell">
        <header class="identity">
          <h1 id="lake-title">Lake Lanier</h1>
          <p>Buford Dam, Georgia</p>
        </header>
        <div class="reading" aria-live="polite">
          <p class="eyebrow">Current water level</p>
          <div class="figure">
            <span class="direction" id="direction" aria-hidden="true" hidden></span>
            <span id="difference">—</span><span class="units">ft</span>
          </div>
          <p class="comparison" id="comparison">Relative to 1,071 ft (summer full pool)</p>
          <dl class="details">
            <div><dt>Lake elevation</dt><dd id="elevation">—</dd></div>
            <div><dt>Measured</dt><dd id="measured">—</dd></div>
          </dl>
          <p class="reading-status" id="reading-status" hidden></p>
          <button class="retry hero-retry" id="retry-reading" type="button" hidden>Retry reading</button>
        </div>
      </div>
    </section>

    <section class="history shell" aria-labelledby="history-title">
      <header class="history-header">
        <h2 id="history-title">Lake level history</h2>
        <div class="filters">
          <label>Range<select id="range">
            <option value="today">Today</option>
            <option value="7d">Last 7 days</option>
            <option value="30d" selected>Last 30 days</option>
            <option value="90d">Last 90 days</option>
            <option value="6m">Last 6 months</option>
            <option value="1y">Last 1 year</option>
            <option value="10y">Last 10 years</option>
          </select></label>
          <label>Interval<select id="interval"><option value="auto">Auto</option><option value="daily" selected>Daily</option><option value="weekly">Weekly</option></select></label>
        </div>
      </header>
      <div class="chart-card">
        <div class="legend">
          <span><i class="legend-line" aria-hidden="true"></i><span id="series-label">Daily average</span></span>
          <span><i class="legend-line pool" aria-hidden="true"></i>Summer full pool</span>
        </div>
        <div class="plot" id="plot">
          <canvas id="chart" aria-hidden="true"></canvas>
          <input id="point-picker" type="range" min="0" max="0" value="0" aria-label="Explore lake elevation readings" hidden>
          <div class="tooltip" id="tooltip" hidden aria-hidden="true"></div>
          <div class="chart-message" id="chart-message" role="status">
            <span id="chart-status">Loading elevation history…</span>
            <button class="retry" id="retry-history" type="button" hidden>Retry chart</button>
          </div>
        </div>
      </div>
      <footer class="source"><a href="https://waterdata.usgs.gov/monitoring-location/USGS-02334400/">USGS gauge 02334400</a></footer>
    </section>
  </main>
</body>
</html>
